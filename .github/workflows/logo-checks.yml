name: Logo checks
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  support:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22
      - run: node --test tests/logo-support.test.mjs
      - name: Check runtime syntax
        run: |
          for file in assets/logo/boot.js assets/logo/scene-glasslogo.js assets/logo/scene-bakedlogo.js assets/logo/optical-shader.js assets/logo/entrance.js assets/logo/render-budget.js; do
            node --check "$file"
          done
